services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: cloudline
      MYSQL_USER: cloudline
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: secret
    ports:
      - "3306:3306"
    volumes:
      - cloudline_mysql:/var/lib/mysql

volumes:
  cloudline_mysql:
